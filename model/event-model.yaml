               extra: [x], cost: "100.00", currency: UAH, category: fuel}
        then_error: invalid
      - name: a visit that fixes two reported issues
        given: [{type: issue/reported, car: forester, issue: I-0001, at: "2026-11-20", text: "Left turn signal"},
                {type: issue/reported, car: forester, issue: I-0002, at: "2026-11-20", text: "Handbrake too weak"}]
