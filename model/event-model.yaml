        when: {type: maintenance/log, car: transit, entry: M-0014, at: "2026-11-17", km: 248300, items: [], extra: [],
               parts: [{name: "Transmission oil", qty: 2.3, unit: l, price: "850.00", sum: "1955.00"}],
               cost: "2000.00", currency: UAH, category: repair}
