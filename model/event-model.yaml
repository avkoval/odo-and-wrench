        then: [{type: maintenance/performed, car: transit, entry: M-0006, at: "2026-11-05", km: 214000, items: [],
                extra: ["winter tyres on, balancing"], cost: "1200.00", currency: UAH, category: tyres}]
      - name: a garage visit with parts and labour lines
        given: [{type: car/registered, car: transit, name: x, plate: "KA5678BI"}]
        when: {type: maintenance/log, car: transit, entry: M-0012, at: "2026-11-17", km: 248300, items: [], extra: [],
