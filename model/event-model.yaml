               cost: "2450.00", currency: UAH, category: repair, place: "Service centre", order_no: "1234"}
        then: [{type: maintenance/performed, car: transit, entry: M-0012, at: "2026-11-17", km: 248300, items: [],
                extra: [],
                parts: [{name: "Wheel bearing", qty: 1, unit: pcs, price: "1600.00", sum: "1600.00"}],
                labor: [{name: "Replace the wheel bearing", qty: 0.5, unit: h, price: "1700.00", sum: "850.00"}],
                cost: "2450.00", currency: UAH, category: repair, place: "Service centre", order_no: "1234"}]
      - name: a line whose sum is not quantity × price
        given: [{type: car/registered, car: transit, name: x, plate: "KA5678BI"}]
        when: {type: maintenance/log, car: transit, entry: M-0013, at: "2026-11-17", km: 248300, items: [], extra: [],
               parts: [{name: "Transmission oil", qty: 2.3, unit: l, price: "850.00", sum: "1995.00"}],
