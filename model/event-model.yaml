      - name: nothing done
        given: [{type: car/registered, car: forester, name: x, plate: "AA1234BB"}]
        when: {type: maintenance/log, car: forester, entry: M-0004, at: "2026-11-12", km: 129900, items: [],
               extra: []}
        then_error: invalid
      - name: an item that is not in the car's schedule (or is retired)
        given: [{type: schedule/item-defined, car: transit, item: dpf-cleaning, title: x, every_km: 80000},
                {type: schedule/item-retired, car: transit, item: dpf-cleaning, reason: x}]
        when: {type: maintenance/log, car: transit, entry: M-0005, at: "2026-11-12", km: 214300,
               items: [dpf-cleaning], extra: []}
        then_error: invalid

  - id: import-receipt
    type: translation
    screen: log-entry
    # Adapter: the owner gives any AI agent the photo of a garage receipt and the prompt the app copies
    # (docs/receipt-format.md), and pastes the agent's JSON answer into Log work (D18). The JSON becomes a diary entry
    # with its parts and labour lines; the owner still ticks the scheduled jobs and fixed issues it covers and picks
    # the category. The same checks as typed lines apply (D17); `total` must match the lines.
    command: maintenance/import-receipt
    events: [maintenance/performed]
    gwt:
      - name: a receipt with parts and labour becomes one diary entry
        given: [{type: schedule/item-defined, car: transit, item: transmission-oil, title: "Transmission oil",
                 every_km: 60000}]
        when: {type: maintenance/import-receipt, car: transit, entry: M-0020, items: [transmission-oil], fixes: [],
               category: repair, photos: ["photos/transit/2026-11-17-M-0020.jpg"],
               receipt: '{"date": "2026-11-17", "km": 248300, "place": "Service centre", "order_no": "1234",
                          "currency": "UAH",
                          "parts": [{"name": "Transmission oil 75W-80", "qty": 2.3, "unit": "l", "price": 850.00,
                                     "sum": 1955.00}],
                          "labor": [{"name": "Remove and refit the underbody shield", "qty": 0.2, "unit": "h",
                                     "price": 1700.00, "sum": 340.00}],
                          "total": 2295.00}'}
        then: [{type: maintenance/performed, car: transit, entry: M-0020, at: "2026-11-17", km: 248300,
                items: [transmission-oil], extra: [], fixes: [],
                parts: [{name: "Transmission oil 75W-80", qty: 2.3, unit: l, price: "850.00", sum: "1955.00"}],
                labor: [{name: "Remove and refit the underbody shield", qty: 0.2, unit: h, price: "1700.00",
                         sum: "340.00"}],
                cost: "2295.00", currency: UAH, category: repair, place: "Service centre", order_no: "1234",
                photos: ["photos/transit/2026-11-17-M-0020.jpg"], source: receipt}]
      - name: a total that does not match the lines (transcription error)
        given: [{type: car/registered, car: transit, name: x, plate: "KA5678BI"}]
        when: {type: maintenance/import-receipt, car: transit, entry: M-0021, items: [], fixes: [], category: repair,
               receipt: '{"date": "2026-11-17", "km": 248300, "currency": "UAH",
                          "parts": [{"name": "Wheel bearing", "qty": 1, "unit": "pcs", "price": 1600.00, "sum": 1600.00}],
                          "labor": [], "total": 1700.00}'}
        then_error: invalid
      - name: text that is not a receipt in the format
        given: [{type: car/registered, car: transit, name: x, plate: "KA5678BI"}]
        when: {type: maintenance/import-receipt, car: transit, entry: M-0022, items: [], fixes: [], category: repair,
               receipt: "Here is your receipt: oil 2.3 l, 1955 UAH"}
        then_error: invalid

  - id: void-maintenance
    type: state-change
    screen: diary
    command: maintenance/void
    events: [maintenance/voided]
    gwt:
      - name: an entry made by mistake is voided with a reason
        given: [{type: maintenance/performed, car: forester, entry: M-0003, at: "2026-11-12", km: 129900, items: [],
                 extra: [x]}]
        when: {type: maintenance/void, car: forester, entry: M-0003, reason: "logged for the wrong car"}
        then: [{type: maintenance/voided, car: forester, entry: M-0003, reason: "logged for the wrong car"}]
      - name: voiding twice
        given: [{type: maintenance/performed, car: forester, entry: M-0003, at: "2026-11-12", km: 129900, items: [],
                 extra: [x]},
                {type: maintenance/voided, car: forester, entry: M-0003, reason: x}]
        when: {type: maintenance/void, car: forester, entry: M-0003, reason: y}
        then_error: not-found

  - id: diary
    type: state-view
    screen: diary
    read_model: diary
    events: [maintenance/performed, maintenance/voided, schedule/item-defined]
    gt:
      - name: newest first, item titles resolved, voided entries hidden
        given:
          - {type: schedule/item-defined, car: transit, item: engine-oil, title: "Engine oil", every_km: 15000}
          - {type: maintenance/performed, car: transit, entry: M-0001, at: "2026-03-01", km: 205000,
             items: [engine-oil], extra: []}
          - {type: maintenance/performed, car: transit, entry: M-0002, at: "2026-11-10", km: 214200,
             items: [engine-oil], extra: [], cost: "2850.00", currency: UAH}
          - {type: maintenance/performed, car: transit, entry: M-0003, at: "2026-11-11", km: 214250, items: [],
             extra: [x]}
          - {type: maintenance/voided, car: transit, entry: M-0003, reason: x}
        then: {car: transit, entries: [{entry: M-0002, at: "2026-11-10", km: 214200, titles: ["Engine oil"],
                                        cost: "2850.00", currency: UAH},
                                       {entry: M-0001, at: "2026-03-01", km: 205000, titles: ["Engine oil"]}]}

      - name: receipt lines and the order number are shown with the entry
        given:
          - {type: maintenance/performed, car: transit, entry: M-0012, at: "2026-11-17", km: 248300, items: [],
             extra: [], parts: [{name: "Wheel bearing", qty: 1, unit: pcs, price: "1600.00", sum: "1600.00"}],
             labor: [{name: "Replace the wheel bearing", qty: 0.5, unit: h, price: "1700.00", sum: "850.00"}],
             cost: "2450.00", currency: UAH, category: repair, order_no: "1234"}
        then: {entries: [{entry: M-0012, order_no: "1234",
                          parts: [{name: "Wheel bearing", qty: 1, unit: pcs, price: "1600.00", sum: "1600.00"}],
                          labor: [{name: "Replace the wheel bearing", qty: 0.5, unit: h, price: "1700.00",
                                   sum: "850.00"}]}]}

  - id: costs-by-year
    type: state-view
    screen: costs
    # Money spent per car, year and category, from diary entries with a cost; voided entries do not count. Totals are
    # per currency (no conversion). Fuel is not here: fuel receipts / bank import are a later phase (D12).
    # Entries with receipt lines also add to by_kind (parts / labor, D19); the rest of their cost counts as "other".
    read_model: costs-by-year
    events: [maintenance/performed, maintenance/voided]
    gt:
      - name: totals per year and category
        given:
          - {type: maintenance/performed, car: transit, entry: M-0002, at: "2026-11-10", km: 214200,
             items: [engine-oil], extra: [], cost: "2850.00", currency: UAH, category: service}
          - {type: maintenance/performed, car: transit, entry: M-0006, at: "2026-11-05", km: 214000, items: [],
             extra: [x], cost: "1200.00", currency: UAH, category: tyres}
          - {type: maintenance/performed, car: transit, entry: M-0008, at: "2026-04-01", km: 209000, items: [],
             extra: [x], cost: "6400.00", currency: UAH, category: repair}
          - {type: maintenance/performed, car: transit, entry: M-0009, at: "2026-04-02", km: 209010, items: [],
             extra: [x], cost: "500.00", currency: UAH, category: repair}
          - {type: maintenance/voided, car: transit, entry: M-0009, reason: x}
          - {type: maintenance/performed, car: transit, entry: M-0001, at: "2025-10-01", km: 200000,
             items: [engine-oil], extra: [], cost: "2500.00", currency: UAH, category: service}
        then: {car: transit, years: [{year: 2026, currency: UAH, total: "10450.00",
                                      by_category: {service: "2850.00", repair: "6400.00", tyres: "1200.00"}},
                                     {year: 2025, currency: UAH, total: "2500.00",
                                      by_category: {service: "2500.00"}}]}

      - name: parts and labour per year from receipt lines
        given:
          - {type: maintenance/performed, car: transit, entry: M-0012, at: "2026-11-17", km: 248300, items: [],
             extra: [], parts: [{name: "Wheel bearing", qty: 1, unit: pcs, price: "1600.00", sum: "1600.00"}],
             labor: [{name: "Replace the wheel bearing", qty: 0.5, unit: h, price: "1700.00", sum: "850.00"}],
             cost: "2450.00", currency: UAH, category: repair}
          - {type: maintenance/performed, car: transit, entry: M-0006, at: "2026-11-05", km: 248000, items: [],
             extra: [x], cost: "1200.00", currency: UAH, category: tyres}
        then: {years: [{year: 2026, currency: UAH, total: "3650.00",
                        by_kind: {parts: "1600.00", labor: "850.00", other: "1200.00"}}]}

  # ---------------------------------------------------------------- issues (things to fix, D14)
  - id: report-issue
    type: state-change
    screen: car
    # A one-off defect noticed on the car ("left turn signal does not work"). Not a schedule item: it is open until a
    # diary entry fixes it (log-maintenance `fixes`) or the owner withdraws it.
    command: issue/report
    events: [issue/reported]
    gwt:
      - name: a defect is noted with a photo
        given: [{type: car/registered, car: forester, name: x, plate: "AA1234BB"}]
        when: {type: issue/report, car: forester, issue: I-0001, at: "2026-11-20", text: "Left turn signal",
               photo: "photos/forester/2026-11-20-issue.jpg"}
        then: [{type: issue/reported, car: forester, issue: I-0001, at: "2026-11-20", text: "Left turn signal",
                photo: "photos/forester/2026-11-20-issue.jpg"}]
      - name: a blank text
        given: [{type: car/registered, car: forester, name: x, plate: "AA1234BB"}]
        when: {type: issue/report, car: forester, issue: I-0001, at: "2026-11-20", text: "  "}
        then_error: invalid
      - name: unknown car
        given: []
        when: {type: issue/report, car: lada, issue: I-0001, at: "2026-11-20", text: x}
        then_error: not-found

  - id: withdraw-issue
    type: state-change
    screen: car
    # The issue went away without a garage visit (fixed by hand, false alarm). Fixed issues are closed by the diary.
    command: issue/withdraw
    events: [issue/withdrawn]
    gwt:
      - name: an issue fixed by hand is withdrawn with a reason
        given: [{type: issue/reported, car: forester, issue: I-0001, at: "2026-11-20", text: "Left turn signal"}]
        when: {type: issue/withdraw, car: forester, issue: I-0001, reason: "bulb replaced myself"}
        then: [{type: issue/withdrawn, car: forester, issue: I-0001, reason: "bulb replaced myself"}]
      - name: an issue that is not open
        given: [{type: issue/reported, car: forester, issue: I-0001, at: "2026-11-20", text: x},
                {type: maintenance/performed, car: forester, entry: M-0010, at: "2026-11-28", km: 130900,
                 items: [], extra: [], fixes: [I-0001]}]
        when: {type: issue/withdraw, car: forester, issue: I-0001, reason: x}
        then_error: not-found

  - id: open-issues
    type: state-view
    screen: car
    # Open issues of a car, oldest first, and the same list as a ready message to copy or share with the mechanic
    # (Android share sheet / clipboard; sharing is not an event, D15). Voiding the diary entry that fixed an issue
    # reopens it.
    read_model: open-issues
    events: [car/registered, issue/reported, issue/withdrawn, maintenance/performed, maintenance/voided]
    gt:
      - name: two open issues and the message for the mechanic
        given:
          - {type: car/registered, car: forester, name: "Subaru Forester", plate: "AA1234BB"}
          - {type: issue/reported, car: forester, issue: I-0001, at: "2026-11-20", text: "Left turn signal"}
          - {type: issue/reported, car: forester, issue: I-0002, at: "2026-11-21", text: "Handbrake too weak"}
        then: {car: forester,
               issues: [{issue: I-0001, at: "2026-11-20", text: "Left turn signal"},
                        {issue: I-0002, at: "2026-11-21", text: "Handbrake too weak"}],
               message: "Subaru Forester (AA1234BB) — to fix:\n1. Left turn signal\n2. Handbrake too weak"}
      - name: fixed and withdrawn issues leave the list
        given:
          - {type: car/registered, car: forester, name: "Subaru Forester", plate: "AA1234BB"}
          - {type: issue/reported, car: forester, issue: I-0001, at: "2026-11-20", text: "Left turn signal"}
          - {type: issue/reported, car: forester, issue: I-0002, at: "2026-11-21", text: "Handbrake too weak"}
          - {type: issue/reported, car: forester, issue: I-0003, at: "2026-11-22", text: "Rattle in the boot"}
          - {type: maintenance/performed, car: forester, entry: M-0010, at: "2026-11-28", km: 130900, items: [],
             extra: [], fixes: [I-0001]}
          - {type: issue/withdrawn, car: forester, issue: I-0003, reason: "loose jack, tied it"}
        then: {issues: [{issue: I-0002, text: "Handbrake too weak"}]}
      - name: voiding the entry that fixed an issue reopens it
        given:
          - {type: car/registered, car: forester, name: "Subaru Forester", plate: "AA1234BB"}
          - {type: issue/reported, car: forester, issue: I-0001, at: "2026-11-20", text: "Left turn signal"}
          - {type: maintenance/performed, car: forester, entry: M-0010, at: "2026-11-28", km: 130900, items: [],
             extra: [], fixes: [I-0001]}
          - {type: maintenance/voided, car: forester, entry: M-0010, reason: "logged for the wrong car"}
        then: {issues: [{issue: I-0001, text: "Left turn signal"}]}

  # ---------------------------------------------------------------- what is due
  - id: due-list
    type: state-view
    screen: car
    # per active schedule item: last done (latest non-voided entry with the item), next due by km and by date,
    # predicted date for the km limit (km_per_day from mileage), and the status by whichever limit comes first.
    # Evaluated against `today` (a parameter of the view, not an event).
    read_model: due-list
    events: [schedule/item-defined, schedule/item-changed, schedule/item-retired, maintenance/performed,
             maintenance/voided, odometer/recorded, odometer/corrected, settings/reminders-configured]
    gt:
      - name: km limit is near -> soon, with a predicted date
        given:
          - {type: schedule/item-defined, car: forester, item: engine-oil, title: "Engine oil + filter",
             every_km: 10000, every_months: 12}
          - {type: maintenance/performed, car: forester, entry: M-0001, at: "2026-01-10", km: 120000,
             items: [engine-oil], extra: []}
          - {type: odometer/recorded, car: forester, reading: O-0001, at: "2026-10-02", km: 128500, source: photo}
          - {type: odometer/recorded, car: forester, reading: O-0002, at: "2026-11-01", km: 129400, source: photo}
        then: {today: "2026-11-01", items: [{item: engine-oil, last_km: 120000, last_at: "2026-01-10",
                                             due_km: 130000, due_at: "2027-01-10", remaining_km: 600,
                                             predicted_at: "2026-11-21", status: soon}]}
      - name: date limit passed although km is fine -> overdue
        given:
          - {type: schedule/item-defined, car: transit, item: coolant, title: "Coolant", every_km: 100000,
             every_months: 24}
          - {type: maintenance/performed, car: transit, entry: M-0001, at: "2024-09-01", km: 180000,
             items: [coolant], extra: []}
          - {type: odometer/recorded, car: transit, reading: O-0001, at: "2026-11-20", km: 214350, source: manual}
        then: {today: "2026-11-20", items: [{item: coolant, due_at: "2026-09-01", due_km: 280000, status: overdue}]}
      - name: never done -> unknown, asks for the history
        given:
          - {type: schedule/item-defined, car: transit, item: timing-belt, title: "Timing belt", every_km: 160000}
        then: {items: [{item: timing-belt, status: unknown}]}
      - name: a changed interval moves the due point; a retired item disappears
        given:
          - {type: schedule/item-defined, car: transit, item: engine-oil, title: x, every_km: 15000}
          - {type: schedule/item-defined, car: transit, item: dpf-cleaning, title: x, every_km: 80000}
          - {type: maintenance/performed, car: transit, entry: M-0002, at: "2026-11-10", km: 214200,
             items: [engine-oil], extra: []}
          - {type: schedule/item-changed, car: transit, item: engine-oil, every_km: 10000, reason: x}
          - {type: schedule/item-retired, car: transit, item: dpf-cleaning, reason: x}
        then: {items: [{item: engine-oil, due_km: 224200}]}
      - name: the soon window comes from the item, else from the reminder settings
        given:
          - {type: settings/reminders-configured, notify_at: "09:00", soon_km: 1500, soon_days: 30, stale_days: 30,
             enabled: true}
          - {type: schedule/item-defined, car: transit, item: engine-oil, title: x, every_km: 10000}
          - {type: schedule/item-defined, car: transit, item: timing-belt, title: x, every_km: 160000,
             soon_km: 5000}
          - {type: maintenance/performed, car: transit, entry: M-0001, at: "2026-06-01", km: 203000,
             items: [engine-oil], extra: []}
          - {type: maintenance/performed, car: transit, entry: M-0002, at: "2018-05-01", km: 58000,
             items: [timing-belt], extra: []}
          - {type: odometer/recorded, car: transit, reading: O-0001, at: "2026-11-20", km: 214350, source: manual}
        then: {items: [{item: engine-oil, due_km: 213000, status: overdue},
                       {item: timing-belt, due_km: 218000, remaining_km: 3650, status: soon}]}

  # ---------------------------------------------------------------- settings
  - id: choose-language
    type: state-change
    screen: settings
    # English until the owner chooses otherwise (no event = en). Texts live in translation files per language; adding
    # a language is a new file plus an entry in the supported list, not a model change.
    command: settings/choose-language
    events: [settings/language-chosen]
    gwt:
      - name: Ukrainian chosen
        given: []
        when: {type: settings/choose-language, language: uk}
        then: [{type: settings/language-chosen, language: uk}]
      - name: the language already in use produces no event
        given: [{type: settings/language-chosen, language: uk}]
        when: {type: settings/choose-language, language: uk}
        then: []
      - name: a language without translations
        given: []
        when: {type: settings/choose-language, language: de}
        then_error: invalid

  - id: configure-reminders
    type: state-change
    screen: settings
    # Defaults until configured: 09:00, every day, soon 1000 km / 30 days, odometer photo asked after 30 days, on.
    command: settings/configure-reminders
    events: [settings/reminders-configured]
    gwt:
      - name: evening reminders on weekdays, more notice
        given: []
        when: {type: settings/configure-reminders, notify_at: "19:30", days: [mon, tue, wed, thu, fri],
               soon_km: 1500, soon_days: 45, stale_days: 21, enabled: true}
        then: [{type: settings/reminders-configured, notify_at: "19:30", days: [mon, tue, wed, thu, fri],
                soon_km: 1500, soon_days: 45, stale_days: 21, enabled: true}]
      - name: reminders switched off
        given: []
        when: {type: settings/configure-reminders, notify_at: "09:00", days: [mon, tue, wed, thu, fri, sat, sun],
               soon_km: 1000, soon_days: 30, stale_days: 30, enabled: false}
        then: [{type: settings/reminders-configured, notify_at: "09:00",
                days: [mon, tue, wed, thu, fri, sat, sun], soon_km: 1000, soon_days: 30, stale_days: 30,
                enabled: false}]
      - name: an impossible time or no days
        given: []
        when: {type: settings/configure-reminders, notify_at: "25:00", days: [], soon_km: 1000, soon_days: 30,
               stale_days: 30, enabled: true}
        then_error: invalid

  - id: settings
    type: state-view
    screen: settings
    read_model: settings
    events: [settings/language-chosen, settings/reminders-configured]
    gt:
      - name: defaults with no events
        given: []
        then: {language: en, notify_at: "09:00", days: [mon, tue, wed, thu, fri, sat, sun], soon_km: 1000,
               soon_days: 30, stale_days: 30, enabled: true}
      - name: the latest choice wins
        given:
          - {type: settings/language-chosen, language: uk}
          - {type: settings/language-chosen, language: en}
          - {type: settings/reminders-configured, notify_at: "19:30", days: [sat], soon_km: 1500, soon_days: 45,
             stale_days: 21, enabled: true}
        then: {language: en, notify_at: "19:30", days: [sat], soon_km: 1500}

  # ---------------------------------------------------------------- reminders
  - id: reminders-to-send
    type: automation
    screen: notifications
    # The background job is scheduled for the configured time on the configured days (settings); each run evaluates
    # this todo list against `today`. Todo: items whose status is soon or overdue and that got no reminder at that
    # level for the current due point; plus cars whose last reading is older than stale_days. Empty when reminders
    # are switched off. Notification texts are in the chosen language.
    read_model: reminders-to-send
    command: reminder/send
    events: [schedule/item-defined, schedule/item-changed, maintenance/performed, odometer/recorded, reminder/sent,
             settings/reminders-configured]
    gt:
      - name: a soon item without a reminder is on the list
        given:
          - {type: schedule/item-defined, car: forester, item: engine-oil, title: x, every_km: 10000}
          - {type: maintenance/performed, car: forester, entry: M-0001, at: "2026-01-10", km: 120000,
             items: [engine-oil], extra: []}
          - {type: odometer/recorded, car: forester, reading: O-0001, at: "2026-11-01", km: 129400, source: photo}
        then: {today: "2026-11-01", todo: [{car: forester, item: engine-oil, level: soon, due_km: 130000}]}
      - name: already reminded at this level -> off the list
        given:
          - {type: schedule/item-defined, car: forester, item: engine-oil, title: x, every_km: 10000}
          - {type: maintenance/performed, car: forester, entry: M-0001, at: "2026-01-10", km: 120000,
             items: [engine-oil], extra: []}
          - {type: odometer/recorded, car: forester, reading: O-0001, at: "2026-11-01", km: 129400, source: photo}
          - {type: reminder/sent, car: forester, item: engine-oil, level: soon, due_km: 130000, at: "2026-11-01"}
        then: {today: "2026-11-02", todo: []}
      - name: a wider soon window from the settings puts the item on the list earlier
        given:
          - {type: settings/reminders-configured, notify_at: "19:30", days: [sat], soon_km: 1500, soon_days: 45,
             stale_days: 21, enabled: true}
          - {type: schedule/item-defined, car: forester, item: engine-oil, title: x, every_km: 10000}
          - {type: maintenance/performed, car: forester, entry: M-0001, at: "2026-01-10", km: 120000,
             items: [engine-oil], extra: []}
          - {type: odometer/recorded, car: forester, reading: O-0001, at: "2026-10-20", km: 128800, source: photo}
        then: {today: "2026-10-24", todo: [{car: forester, item: engine-oil, level: soon, due_km: 130000}]}
      - name: no reading for longer than stale_days -> ask for a photo
        given:
          - {type: odometer/recorded, car: transit, reading: O-0001, at: "2026-10-01", km: 213000, source: photo}
        then: {today: "2026-11-05", todo: [{car: transit, kind: odometer-stale, last_at: "2026-10-01"}]}
      - name: reminders switched off -> nothing to send
        given:
          - {type: settings/reminders-configured, notify_at: "09:00", days: [mon], soon_km: 1000, soon_days: 30,
             stale_days: 30, enabled: false}
          - {type: odometer/recorded, car: transit, reading: O-0001, at: "2026-10-01", km: 213000, source: photo}
        then: {today: "2026-11-05", todo: []}

  - id: send-reminder
    type: state-change
    screen: notifications
    command: reminder/send
    events: [reminder/sent]
    gwt:
      - name: the notification is shown and recorded
        given: [{type: schedule/item-defined, car: forester, item: engine-oil, title: x, every_km: 10000}]
        when: {type: reminder/send, car: forester, item: engine-oil, level: soon, due_km: 130000, at: "2026-11-01",
               text: "Subaru Forester: engine oil in 600 km (~21 Nov)"}
        then: [{type: reminder/sent, car: forester, item: engine-oil, level: soon, due_km: 130000, at: "2026-11-01",
                text: "Subaru Forester: engine oil in 600 km (~21 Nov)"}]
      - name: the same level for the same due point is sent once
        given: [{type: reminder/sent, car: forester, item: engine-oil, level: soon, due_km: 130000,
                 at: "2026-11-01"}]
        when: {type: reminder/send, car: forester, item: engine-oil, level: soon, due_km: 130000, at: "2026-11-02",
               text: x}
        then: []
