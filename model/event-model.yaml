      - name: fixing an issue that is not open (unknown, already fixed or withdrawn)
        given: [{type: issue/reported, car: forester, issue: I-0001, at: "2026-11-20", text: x},
                {type: issue/withdrawn, car: forester, issue: I-0001, reason: x}]
        when: {type: maintenance/log, car: forester, entry: M-0011, at: "2026-11-28", km: 130900, items: [],
               extra: [], fixes: [I-0001]}
