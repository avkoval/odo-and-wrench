# Tests (model check + unit tests) and the release APK.
# - every push / pull request: tests, and the APK as a build artifact (Actions run → Artifacts)
# - a tag v1.2.3: also a GitHub Release with odo-and-wrench-1.2.3.apk attached
# Signing: the keystore in the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD (see docs/developer-guide.md, "CI"). Without them (forks) the APK is signed with the runner's
# throwaway debug key and cannot be installed over a properly signed one.
name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.9        # pinned: Flutter 3.50 hangs the ClojureDart compiler (ClojureDart#389)
  CLOJURE_CLI_VERSION: 1.12.7.1681

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: DeLaGuardo/setup-clojure@13.4
        with: {cli: '${{ env.CLOJURE_CLI_VERSION }}'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-${{ hashFiles('deps.edn') }}
      - run: flutter pub get
      # a fresh checkout, so the test build cannot leak into an app build (20261122-build-workarounds-issue.org)
      - run: clojure -M:test:cljd test

  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release on a tag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: DeLaGuardo/setup-clojure@13.4
        with: {cli: '${{ env.CLOJURE_CLI_VERSION }}'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-${{ hashFiles('deps.edn') }}

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # versionCode must grow so Android installs a new APK over the old one: minutes since 1970, the same
          # rule as `bb release`, so local and CI builds can be installed over each other in time order
          echo "code=$(( $(date +%s) / 60 ))" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets: the APK is signed with a throwaway debug key"
          fi

      - run: flutter pub get
      - run: clojure -M:cljd compile
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name "${{ steps.version.outputs.name }}" --build-number "${{ steps.version.outputs.code }}"
          cp build/app/outputs/flutter-apk/app-release.apk "odo-and-wrench-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: odo-and-wrench-${{ steps.version.outputs.name }}
          path: odo-and-wrench-*.apk

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" odo-and-wrench-*.apk \
            --title "Odo & Wrench ${{ steps.version.outputs.name }}" --generate-notes
